<section class="contacts" id="contact">
    <div class="contacts_container">
        <h2 class="contacts_title">Давайте работать вместе!</h2>
        <p class="contacts_subtitle">
            Открыт к новым и интересным проектам
        </p>

        @if (resumeService.resumeData(); as data){
            <div class="contacts_grid">
                @for (contact of data.contacts; track contact.type){
                    <a [href]="contact.url" target="_blank" rel="noopener noreferrer" class="contacts_card">

                        <div class="contacts_icon">
                            @switch (contact.type){
                                @case ('github'){
                                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                                }
                                @case ('telegram'){
                                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                                }
                                @case ('email'){
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                        <polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                }
                                @case ('VK') {
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M13.162 18.994c.609 0 .858-.406.851-1.603-.002-.502.157-.643.678-.643.426 0 .612.153.923.613.588.874 1.162 1.633 2.488 1.633h2.272c.826 0 1.239-.488.949-1.177-.323-.768-1.354-1.99-2.294-2.959-.472-.494-.472-.793.096-1.445.497-.568 1.957-2.089 2.464-3.258.396-.912.15-1.428-.83-1.428h-2.46c-.71 0-.86.407-1.057.846-.422.961-.996 1.938-1.42 1.938-.312 0-.395-.223-.395-.87V7.646c0-.734-.135-1.013-.873-1.013h-2.48c-.477 0-.77.329-.77.66 0 .692 1.011.834 1.116 2.76.028.514.028.979-.042 1.398-.21.605-.664.438-1.157-.329-1.267-1.923-2.06-4.123-2.06-4.123-.14-.321-.377-.65-.907-.65H6.473c-.586 0-1.021.329-.852.977.756 2.72 3.25 8.202 6.84 8.202h1.701z"/>
                                    </svg>
                                }
                            }
                        </div>

                        <span class="contacts_label">{{ contact.label }}</span>
                    </a>
                }
            </div>
        }
    </div>
</section>
