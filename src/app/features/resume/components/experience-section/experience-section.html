<section class="experience" id="experience" appScrollReveal>
    <h2 class="experience_title">Опыт работы 👀</h2>

    @if(resumeService.resumeData(); as data) {
        <div class="experience_list">
            @for (exp of data.experience; track exp.company){
                <app-experience-card [experience]="exp"/>
            } @empty {
                <p>No experience</p>
            }
        </div>
    } @else if(resumeService.isLoading()){
    <p>Загрузка опыта...</p>
    }
</section>
